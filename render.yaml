services:
  - type: web
    name: lschat
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT ludochat.asgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "0"

      - key: DJANGO_SECRET_KEY
        generateValue: true